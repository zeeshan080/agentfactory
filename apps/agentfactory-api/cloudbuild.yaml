# Google Cloud Build configuration
# Builds and deploys to Cloud Run

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agentfactory-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agentfactory-api:latest'
      - '.'
    dir: 'apps/agentfactory-api'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentfactory-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agentfactory-api:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agentfactory-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agentfactory-api:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'

substitutions:
  _REGION: us-central1

images:
  - 'gcr.io/$PROJECT_ID/agentfactory-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/agentfactory-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
